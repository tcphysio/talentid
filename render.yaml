# Render Blueprint — deploys this app with one click via "New +" > "Blueprint"
# pointed at your GitHub repo. See README.md for the full walkthrough.
#
# Uses the Starter plan (not Free) plus a small persistent disk, because the
# Free plan cannot attach persistent disks — its filesystem is wiped on every
# spin-down, which would silently lose real player submissions stored in
# SQLite. Starter + 1GB disk runs about $7.25/month.

services:
  - type: web
    name: cricket-italia-talent-id
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false   # set this yourself in the Render dashboard — don't commit it
      - key: DB_DIR
        value: /var/data
      - key: FOLLOWUP_CRON_TOKEN
        generateValue: true
    disk:
      name: talentid-data
      mountPath: /var/data
      sizeGB: 1
